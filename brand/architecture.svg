<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="title desc">
  <title id="title">Lenz system architecture</title>
  <desc id="desc">Lenz separates device state, encrypted delivery and connected financial execution. The prepared browser app and Android WebView keep device state and encrypted original packets. Android adds a native Bluetooth LE bridge and packaged GET assets; it has no financial POST backend. Shared packet eligibility feeds BLE, Nostr, carrier and WebRTC adapters. Authenticated intake saves state and a signed recipient receipt atomically. Direct BLE delivery was observed on two Android phones; physical multi-hop, background operation and restart recovery remain unverified. Browser Wallet review binds exact signed financial authority and reserved inputs. Configured web services retain originals and journals, execute testnet actions, verify canonical outcomes and reconcile Wallet activity. Routes include NEAR reserve, Rhea and the original Intents verifier, a proof-funded fixed-rate Aurora venue, Aave Sepolia and separate native Zcash PCZT review, proving and signing. Zcash custody is separate from browser account storage. NEAR and EVM settlement is public despite encrypted requests. Transport acknowledgements, signed message receipts and verified financial settlement are separate checks.</desc>
